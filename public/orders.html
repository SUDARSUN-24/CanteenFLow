<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My orders · CanteenFlow</title>
  <meta name="theme-color" content="#0e7a57">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="wrap">
    <a class="back" href="/">← All stalls</a>
    <h1>My orders</h1>
    <p class="lead">Orders placed on this device, with the status from the stall. You can cancel an order until the stall starts preparing it.</p>
    <div class="orders-list" id="list"></div>

    <h2>Find an order by number</h2>
    <form class="search-panel" id="find" style="grid-template-columns:1fr auto;align-items:end">
      <div class="field">
        <label for="num">Order number</label>
        <input id="num" placeholder="CF-7K3QXM" autocapitalize="characters" autocomplete="off" required>
      </div>
      <button class="btn" type="submit">Find</button>
    </form>
  </main>
  <script src="/js/cart.js"></script>
  <script src="/js/schedule.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/orders.js"></script>
</body>
</html>
